{%extends 'base.html' %}
{%block title %}HOMEZO{%endblock %}

{%block content %}
<div class="container">
    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--text-color);">Login</h2>

        {%if msg %}
        <div class="alert alert-danger"
            style="background: #ffe3e3; color: #c92a2a; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
            {{msg}}
        </div>
        {%endif %}

        <form method="POST">
            {%csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="id_password" class="form-control" required
                        placeholder="Enter your password">
                    <i class="far fa-eye" id="togglePassword"
                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;"></i>
                </div>
                <div style="text-align: right; margin-top: 5px;">
                    <a href="/login/forgot_pass/" style="font-size: 12px; color: var(--accent-color);">Forgot
                        Password?</a>
                </div>
            </div>

            <script>
                const togglePassword = document.querySelector('#togglePassword');
                const password = document.querySelector('#id_password');

                togglePassword.addEventListener('click', function (e) {
                    // toggle the type attribute
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    // toggle the eye / eye slash icon
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            </script>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; border-radius: 4px; margin-top: 10px;">Login</button>

            <div style="text-align: center; margin-top: 20px;">
                <span style="font-size: 13px; color: #666;">New to Emox?</span>
                <a href="/register_for_buyer/reg/"
                    style="font-size: 13px; color: var(--accent-color); font-weight: 600;">create
                    an account</a>
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <span style="font-size: 13px; color: #666;">Want to sell?</span>
                <a href="/register_for_seller/add/"
                    style="font-size: 13px; color: var(--accent-color); font-weight: 600;">Register as Seller</a>
            </div>
        </form>
    </div>
</div>
{%endblock %}
