<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password | Homezo</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }



        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #004d40;
            margin-bottom: 10px;
            display: inline-block;
            text-decoration: none;
        }

        .card-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .card-subtitle {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-control:focus {
            border-color: #004d40;
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 77, 64, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #004d40;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #00382e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 77, 64, 0.3);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #004d40;
        }

        .back-link i {
            margin-right: 8px;
            font-size: 12px;
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            background: #e0f2f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #004d40;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="icon-circle">
            <i class="fas fa-lock"></i>
        </div>
        <h2 class="card-title">Forgot Password?</h2>
        <p class="card-subtitle">Don't worry! Enter your email address below and we'll help you reset your password.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
            </div>

            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <a href="/login/log/" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>
</body>

</html>
